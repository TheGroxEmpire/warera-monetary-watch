services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: warera_monetary_watch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warera_monetary_watch"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: warera-monetary-watch:local
    build: .
    env_file:
      - .env
    working_dir: /app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    image: warera-monetary-watch:local
    build: .
    env_file:
      - .env
    working_dir: /app
    command: ["python", "-m", "warera_monetary_watch.collector"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: warera-monetary-watch:local
    build: .
    env_file:
      - .env
    working_dir: /app
    command: ["python", "-m", "warera_monetary_watch.web"]
    ports:
      - "${WEB_PUBLISHED_PORT:-8000}:${WEB_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport os\nimport urllib.request\nbase_path = (os.getenv('APP_BASE_PATH') or '/monetary-watch').rstrip('/') or '/'\nport = os.getenv('WEB_PORT') or '8000'\nurllib.request.urlopen(f'http://127.0.0.1:{port}{base_path}/static/app.js', timeout=5)\nPY"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  test:
    image: warera-monetary-watch:local
    build: .
    env_file:
      - .env.example
    working_dir: /app
    command: ["pytest"]

volumes:
  postgres_data:
